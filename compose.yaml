services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nim}
      POSTGRES_DB: ${POSTGRES_DB:-nim}
    volumes:
      - nim_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nim} -d ${POSTGRES_DB:-nim}"]
      interval: 5s
      timeout: 5s
      retries: 10

  nim:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:?SITE_URL is required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      SITE_URL: ${SITE_URL}
      DATABASE_URL: postgres://${POSTGRES_USER:-nim}:${POSTGRES_PASSWORD:-nim}@postgres:5432/${POSTGRES_DB:-nim}
      DATA_DIR: /app/.data
      AUTH_SECRET: ${AUTH_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ADMIN_GITHUB_ID: ${ADMIN_GITHUB_ID:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-media}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    volumes:
      - nim_data:/app/.data

volumes:
  nim_pgdata:
  nim_data:
